<!doctype html><meta charset="utf-8"><script>
(async()=>{const p=new URLSearchParams(location.search);const f=p.get('f');
try{const r=await fetch(f,{cache:'no-store'});const b=await r.blob();(window.parent!==window?window.parent:window.opener).postMessage({dabza:1,name:p.get('n')||f,blob:b},'*');}catch(e){(window.parent||window.opener).postMessage({dabza:1,err:String(e)},'*')}})();
</script>
